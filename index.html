<meta name="theme-color" content="#ffffff">
<script>
/* The landing page shows until a visitor has chosen once. After that a child
   opening the site goes straight to the games (the logo there comes back here).
   Older links into the games, with a filter or an open game, always went to the
   home screen and still do. */
(function () {
  const p = new URLSearchParams(location.search);
  const deep = p.has('age') || p.has('subject') || p.has('q') || location.hash.startsWith('#play=');
  let entered = false;
  try { entered = localStorage.getItem('edgames-entered') === '1'; } catch { /* then it shows */ }
  if (deep || (entered && !p.has('home'))) location.replace('play.html' + location.search + location.hash);
})();
</script>
