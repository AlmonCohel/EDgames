<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="game.pageTitle">משחק — הגנון של עלמון</title>
<meta name="theme-color" content="#f4f5f7">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<!-- Sets lang and dir before the first paint, so an English visit never flashes RTL. -->
<script src="assets/i18n.js"></script>
<script>
/* A game opened from the home screen runs in a layer over it (assets/player.js)
   and is kept alive when the child goes back, so coming back to it carries on
   where they were. While it waits behind the home screen it must not go on
   playing by itself: its timers are held and run on return, and the
   `edpause` / `edresume` events tell the sound and voice to stop and start. */
(function () {
  let embedded = false;
  try { embedded = window.parent !== window && Boolean(window.parent.EDPlayer); } catch { /* another origin */ }
  if (embedded) document.documentElement.classList.add('embedded');
  const setT = window.setTimeout.bind(window);
  const setI = window.setInterval.bind(window);
  let paused = false;
  const held = [];
  window.setTimeout = (fn, ms, ...args) => setT(() => {
    if (typeof fn !== 'function') return;
    if (paused) held.push(() => fn(...args)); else fn(...args);
  }, ms);
  window.setInterval = (fn, ms, ...args) => setI(() => { if (!paused && typeof fn === 'function') fn(...args); }, ms);
  window.EDPause = {
    embedded,
    get paused() { return paused; },
    pause() { if (paused) return; paused = true; window.dispatchEvent(new Event('edpause')); },
    resume() {
      if (!paused) return;
      paused = false;
      window.dispatchEvent(new Event('edresume'));
      held.splice(0).forEach((fn) => fn());
    },
  };
})();
</script>
</head>
<body>

<!-- The drawings go in before any markup that references them, so every <use>
     below resolves as the page is parsed rather than after it. -->
<script src="assets/glyphs.js"></script>
<script src="assets/scenes.js"></script>
<script src="assets/covers.js"></script>
<script>EDGlyphs.inject(); EDScenes.inject(); EDCovers.inject();</script>

<header class="appbar">
  <div class="appbar-in">
    <a class="btn btn--ghost" id="back" href="index.html">
      <svg class="ico icon-back" viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-back"/></svg>
      <span data-i18n="game.back">חזרה למשחקים</span>
    </a>
    <button type="button" class="chip sound-toggle" id="sound-toggle"></button>
    <button type="button" class="chip lang-toggle" id="lang-toggle"></button>
  </div>
</header>

<div class="shell">
  <main class="content">

    <div class="game-header" id="game-header" data-subject="shapes">
      <span class="game-mark" id="game-mark" aria-hidden="true"></span>
      <h1 id="game-title" data-i18n="game.loadingTitle">טוען…</h1>
      <div class="badges" id="game-badges"></div>
    </div>

    <div class="game-sets" id="game-sets">
      <span class="game-sets-label" id="set-label" data-i18n="game.sets.label" hidden>ערכה</span>
      <div class="game-sets-chips" id="set-chips" role="group" aria-labelledby="set-label"></div>
      <!-- Starts the step on screen over — the set the child is in, never the
           whole game from its first set. -->
      <button type="button" class="chip game-reset" id="game-reset" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
        <span data-i18n="game.reset">מתחילים מחדש</span>
      </button>
    </div>

    <section class="stage" id="stage" data-subject="shapes"></section>

  </main>
</div>

<script src="assets/catalog.js"></script>
<script src="assets/recent.js"></script>
<!-- The listening games make their sounds rather than fetching them; only the
     game page ever needs it. -->
<script src="assets/sound.js"></script>
<!-- Spoken instructions, letter names and numbers. -->
<script src="assets/voice-lines.js"></script>
<script src="assets/voice.js"></script>
<!-- Shared furniture for the games: speaker button, dots, end screen. -->
<script src="assets/kit.js"></script>
<!-- The site's tune and tap sounds, with the switch in the app bar. -->
<script src="assets/music.js"></script>
<script src="assets/game-host.js"></script>
<script>
  /* The tune plays under a game with no sounds of its own. Inside the home
     screen's layer the home screen is already playing it. */
  EDMusic.init({ music: EDHost.wantsMusic });
  /* Any touch on the page is what lets it make a sound at all. */
  document.addEventListener('pointerdown', () => EDSound.wake(), { capture: true });
</script>
</body>
</html>
